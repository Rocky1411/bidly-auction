<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bidly | Joining Auction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="entry-screen">
    <section class="entry-card setup-page-card">
      <a class="brand entry-brand" href="index.html">
        <span class="brand-mark">B</span><span>bidly</span>
      </a>
      <p class="eyebrow">AUCTIONEER REGISTRATION</p>
      <h1>Welcome to the<br><span>auction room.</span></h1>
      <p class="entry-description">You are joining as an auctioneer. Your 1,000-credit purse will be ready on the auction page.</p>
      <button class="primary-button setup-submit" id="enter-auction" type="button">Enter auction <span>→</span></button>
    </section>
  </main>
  <script type="module">
    const member = JSON.parse(sessionStorage.getItem('bidly-member') || '{}');
    if (member.role !== 'auctioneer' || !member.name) {
      window.location.href = 'index.html';
    }
    document.querySelector('#enter-auction').addEventListener('click', () => {
      window.location.href = 'auction.html';
    });
  </script>
</body>
</html>
